services:
  - type: web
    name: childmonitor-server
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PARENT_PASSWORD
        value: shreeom
      - key: SECRET_KEY
        generateValue: true
